
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento del dedo índice</title>

  <!-- Librerías -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>

<script>
let video;
let handPose;
let hands = [];

function preload() {
  handPose = ml5.handPose();
}

function setup() {
  createCanvas(640, 480);

  video = createCapture(VIDEO);
  video.size(640, 480);
  video.hide();

  handPose.detectStart(video, results => {
    hands = results;
  });
}

function draw() {
  background(0);

  // Mostrar cámara en espejo
  push();
  translate(width, 0);
  scale(-1, 1);
  image(video, 0, 0, width, height);

  // Detectar la mano
  if (hands.length > 0) {

    // Punto 8: punta del dedo índice
    let dedo = hands[0].keypoints[8];

    // Dibujar círculo sobre el dedo
    fill(255, 0, 0);
    noStroke();
    circle(dedo.x, dedo.y, 30);
  }

  pop();
}
</script>

</body>
</html>
