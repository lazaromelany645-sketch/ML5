<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconocimiento imágenes</title>
  <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
  <div class="contenedor">
    <h2>Reconocimiento de imágenes - "Image Classifier"</h2>
    <h4>Utilizando un modelo ya entrenado</h4>
    <hr>
    <div id="ml5-result"><!-- Renderizar el canvas --></div>
  </div>

  <!-- P5 librería para gestión multimedia con JS -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
  <!-- ML5 modelo derivado de TensorFlow -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <script>
    console.log("ml5 version:", ml5.version)

    //Reconocimiento de imagen
    //PASO 1 - Objetos
    let classifier    //Representar ML5
    let img           //Representar imagen que estamos analizando
    let label         //Nombre de lo identificado
    let confidence    //Confianza (0-1) -> %

    //PASO 2 - Configuración
    async function setup(){
      //2.1 Accedemos al modelo pre-entrenado
      classifier = await ml5.imageClassifier("MobileNet")
      //2.2. Obtener la imagen binaria (JPG)
      img = await loadImage('./images/animal4.jpg')

      //2.3. Creamos un lienzo (canvas)
      let lienzo = createCanvas(400, 400)
      lienzo.parent('ml5-result')

      //2.4. Analizar la imagen
      classifier.classify(img, gotResults)
      //2.5. Renderizar la imagen en pantalla
      //(imagen, eje_x1, eje_y1, eje_x2, ejey2)
      image(img, 0, 0, width, height)
    }

    //Callback function
    //PASO 3 - Ejecución > resultados
    function gotResults(results){
      console.log(results)

      //Funciones de PL5 (0 - 255)
      fill(255) //Color fuente -> fill (R,G,B) | fill(X)
      stroke(0) //stroke(R,G,B) -> stroke(X)
      textSize(18)
      label = results[0].label
      //confidence = results[0].confidence //Decimal entre 0 - 1
      //nf (new Format(entero, decimales))
      confidence = nf(results[0].confidence * 100, 2, 2)

      //Renderizar texto en el canvas
      text(label, 5, 20)
      text(`${confidence}%`, 320, 385)
    }
  </script>
</body>
</html>
